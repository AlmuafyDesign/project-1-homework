<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Homework Sheet | Jamia Islamia Boraya</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="homework-sheet" id="homeworkSheet">

            <!-- ================= HEADER ================= -->

            <header class="header">

                <div class="logo-box">
                    <div class="logo-icon">☪</div>
                </div>

                <div class="header-text">

                    <h1>
                        Jamia Islamia Boraya Sreerampur

                        জামিয়া ইসলামিয়া বরায়া শ্রীরামপুর

            </div>

                    <input
                        type="text"
                        id="classInput"
                        class="info-input"
                        value="5"
                        placeholder="Class"
                    >

                </div>


                <div class="info-item">

                    <strong>Date:</strong>

                    <input
                        type="text"
                        id="dateInput"
                        class="date-input"
                        value="11-08-2026"
                        placeholder="Date"
                    >

                </div>

            </div>


            <!-- ================= TITLE ================= -->

            <div class="sheet-title">

            </div>


            <!-- ================= HOMEWORK TABLE ================= -->

            <div class="table-container">

                        <tr>

                                >
                            </td>
                        </tr>


                        <tr>
                            <td>English</td>
                            <td>
                                <input
                                    type="text"
                                    class="lesson-input"
                                    value="Grammar & Composition"
                                    placeholder="Text here"

                            </td>

                            <td>

                        </tr>


                        <tr>

                                <input
                                    type="text"
                                    class="lesson-input"
                                    value="মাখরাজ ও তাজবীদ"
                                    placeholder="Text here"

                                    type="text"

                                >
                            </td>
                        </tr>


                        <tr>
                            <td>Urdu</td>
                            <td>
                                <input
                                    type="text"
                                    class="lesson-input"
                                    value="Urdu Adab"

                                >
                            </td>
                        </tr>


                        <tr>
                            <td>Farsi</td>
                            <td>
                                <input
                                    type="text"
                                    class="lesson-input"
                                    value="فارسی گرامر"
                                    placeholder="Text here"
                                >
                            </td>
                        </tr>


                        <tr>
                            <td>Sura</td>
                            <td>
                                <input
                                    type="text"
                                    class="lesson-input"
                                    value="সুরা ফাতিহা + দুআ"
                                    placeholder="Text here"
                                >
                            </td>
                        </tr>

                </table>

            <div class="button-area">

                <button
                    type="button"
                    id="printBtn"
                    class="print-button"
